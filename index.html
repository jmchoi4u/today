<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#a6dbf6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1530" media="(prefers-color-scheme: dark)">
<title>오늘</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Pixelify+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="sky" aria-hidden="true"><div class="stars"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>

<div class="wrap">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>

<div class="burst" id="burst" aria-hidden="true">CLEAR!</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<footer class="dock">
  <div class="hud" id="hud"></div>
  <nav class="tabs" id="tabs" aria-label="화면 전환">
    <button data-act="tab" data-arg="today"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>오늘</span></button>
    <button data-act="tab" data-arg="flow"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M3 17l5-6 4 3 5-8 4 5"/><path d="M3 21h18"/></svg><span>흐름</span></button>
    <button data-act="tab" data-arg="week"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M5 20V11"/><path d="M12 20V5"/><path d="M19 20v-6"/></svg><span>주간</span></button>
    <button data-act="tab" data-arg="set"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/></svg><span>설정</span></button>
  </nav>
</footer>

<div id="sheet" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
